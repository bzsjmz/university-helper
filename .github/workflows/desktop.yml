name: Fork desktop preview

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Desktop preview version (X.Y.Z or X.Y.Z-beta.N)'
        default: '1.6.0-beta.8'
        required: true

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION:-${REF_NAME#desktop-v}}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || exit 2
          python3 scripts/desktop_version.py --check "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r backend/requirements.txt pytest pytest-asyncio
      - name: Verify desktop storage, settings and lifecycle
        working-directory: backend
        run: >-
          python -m pytest -c /dev/null -q
          tests/unit/test_desktop_entry.py tests/unit/test_desktop_runtime_guards.py
          tests/unit/test_desktop_accounts.py tests/unit/test_desktop_settings.py
          tests/unit/test_desktop_processes.py tests/unit/test_desktop_packaging.py tests/unit/test_managed_account_tasks.py
          tests/unit/test_english_learning.py tests/unit/test_english_password_login.py
          tests/unit/test_english_answering.py tests/unit/test_ai_server_config.py
          tests/unit/test_welearn_workbench.py tests/unit/test_welearn_content_wait.py tests/unit/test_welearn_ai_pacing.py
          tests/unit/test_chapter_diagnostics.py tests/unit/test_chaoxing_learning_retry.py
          tests/unit/test_chaoxing_learning_chapter_limits.py tests/unit/test_course_assessments.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify shared workbench and desktop settings
        working-directory: frontend
        run: |
          npm ci
          npm test -- run src/pages/DesktopSettings.test.jsx src/pages/DesktopRoutes.test.jsx src/pages/ManagedChaoxing.test.jsx src/pages/BatchChaoxing.test.jsx src/pages/TaskConsole.test.jsx src/pages/Dashboard.test.jsx src/pages/ChaoxingFanya.test.jsx src/App.smoke.test.jsx src/pages/WelearnWorkbench.test.jsx src/pages/EnglishLogin.test.jsx src/pages/EnglishLearning.test.jsx --pool=forks --poolOptions.forks.singleFork --testTimeout=15000
          npx eslint src/pages/DesktopSettings.jsx src/pages/DesktopRoutes.test.jsx src/pages/DesktopSettings.test.jsx src/App.jsx src/components/AppLayout.jsx src/pages/Dashboard.jsx src/pages/ChaoxingFanya.jsx src/pages/WelearnWorkbench.jsx src/pages/EnglishLogin.jsx src/pages/EnglishLearning.jsx src/App.smoke.test.jsx --max-warnings 0
          npm run build

  build:
    needs: validate
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Stamp desktop version
        shell: bash
        run: |
          bash scripts/set_version.sh "$VERSION"
          python scripts/desktop_version.py "$VERSION"
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential libssl-dev file
      - name: Build the current workbench
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install isolated desktop build dependencies
        shell: bash
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-english.txt 'pyinstaller>=6.6,<7' pytest pytest-asyncio
      - name: Verify worker pipes on this operating system
        shell: bash
        working-directory: backend
        run: python -m pytest -c /dev/null -q tests/unit/test_desktop_processes.py tests/unit/test_desktop_accounts.py tests/unit/test_desktop_settings.py tests/unit/test_welearn_workbench.py
      - name: Bundle the English browser
        shell: bash
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="$GITHUB_WORKSPACE/frontend/src-tauri/resources/browsers"
          python -m playwright install --only-shell chromium
          if [ "$RUNNER_OS" = Linux ]; then python -m playwright install-deps chromium; fi
      - name: Build frozen backend including browser helpers
        shell: bash
        run: bash scripts/build_sidecar.sh
      - name: Smoke-test frozen backend and worker
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/frontend/src-tauri/resources/browsers
        run: python scripts/smoke_desktop.py
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: frontend/src-tauri -> target
      - name: Stage native sidecar
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: |
          mkdir -p frontend/src-tauri/binaries
          EXT=""
          if [ "$RUNNER_OS" = Windows ]; then EXT=.exe; fi
          cp "dist/uh-backend$EXT" "frontend/src-tauri/binaries/uh-backend-$RUST_TARGET$EXT"
      - name: Build desktop installers
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        with:
          projectPath: frontend
          args: --target ${{ matrix.target }} --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Smoke-test signed macOS bundle
        if: runner.os == 'macOS'
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: |
          BUNDLE="$GITHUB_WORKSPACE/frontend/src-tauri/target/$RUST_TARGET/release/bundle/macos/学道.app"
          export PLAYWRIGHT_BROWSERS_PATH="$BUNDLE/Contents/Resources/browsers"
          python scripts/smoke_desktop.py "$BUNDLE/Contents/MacOS/uh-backend"
      - name: Save installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.target }}
          if-no-files-found: error
          path: |
            frontend/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            frontend/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            frontend/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            frontend/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            frontend/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb

  draft:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Collect installers and create a draft for review
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh run download "$GITHUB_RUN_ID" --repo "$REPOSITORY" --dir release-assets
          python scripts/desktop_release.py --assets release-assets --version "$VERSION"
          gh release create "desktop-v$VERSION" --repo "$REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --title "学道桌面版 $VERSION" --notes-file docs/desktop-release-notes.md
          gh release upload "desktop-v$VERSION" --repo "$REPOSITORY" release-assets/xuedao_* release-assets/SHA256SUMS
